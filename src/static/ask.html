<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plot answers - test</title>
<script src="/static/echarts.min.js"></script>
<style>
/* A test of the plot answer: ask a question, the server sorts it into a
   category, turns its words into a key, and the key picks one of the
   category's three ready-made plots; the page fills it with the real
   figures the server sends. Same question, same plot. Palette and rules
   as the dashboard. */
:root {
  --bg: #061C28; --text: #E6F0F6; --muted: #9FB7C9; --dim: #7892A6;
  --accent: #75D6FF; --hot: #3FD0FF; --good: #2EF2B0; --bad: #FF4F7B;
  --warn: #FFC547; --edge: rgba(117, 214, 255, 0.24);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { zoom: 1.4;font-family: 'Segoe UI', Arial, sans-serif; color: var(--text); min-height: 100vh;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(63, 208, 255, 0.16), transparent 60%),
    radial-gradient(900px 500px at 110% 110%, rgba(124, 108, 255, 0.12), transparent 60%),
    var(--bg); }
.wrap { width: 480px; margin: 0 auto; padding: 12px 0 24px; }
h1 { font-size: 17px; margin: 0 0 2px; }
.sub { font-size: 10px; color: var(--muted); margin-bottom: 8px; }
.ask { display: flex; gap: 6px; }
.ask input { flex: 1; min-width: 0; font-family: inherit; font-size: 11px; color: var(--text);
  background: rgba(14, 44, 61, 0.6); border: 1px solid rgba(117, 214, 255, 0.26);
  border-radius: 7px; padding: 6px 9px; }
.ask input:focus { outline: none; border-color: rgba(63, 208, 255, 0.7);
  box-shadow: 0 0 10px rgba(63, 208, 255, 0.2); }
.ask button { font-family: inherit; font-size: 11px; font-weight: 700; color: #061C28;
  background: var(--hot); border: 0; border-radius: 7px; padding: 6px 12px; cursor: pointer;
  box-shadow: 0 0 12px rgba(63, 208, 255, 0.35); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 7px 0 8px; }
.chips button { font-family: inherit; font-size: 9.5px; color: var(--text); cursor: pointer;
  background: rgba(117, 214, 255, 0.06); border: 1px solid rgba(117, 214, 255, 0.26);
  border-radius: 6px; padding: 3px 7px; }
.chips button:hover { border-color: rgba(63, 208, 255, 0.7); }
.meta { font-size: 9.5px; color: var(--muted); margin-bottom: 6px; min-height: 13px; }
.meta b { color: var(--hot); font-weight: 700; }
.meta .again { color: var(--good); }
.panel { height: 300px; background: rgba(14, 44, 61, 0.55); border: 1px solid var(--edge);
  border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), inset 0 -1px 0 rgba(117, 214, 255, 0.3),
              0 10px 30px rgba(0, 0, 0, 0.35);
  background-image: linear-gradient(to top, rgba(117, 214, 255, 0.08), transparent 40%); }
.top { display: flex; justify-content: space-between; align-items: baseline; }
.cat { font-size: 9.5px; font-weight: 700; color: var(--hot); letter-spacing: 0.08em; text-transform: uppercase; }
.kind { font-size: 9.5px; color: var(--dim); }
.panel h2 { font-size: 14px; margin: 1px 0 6px; }
.body { flex: 1; min-height: 0; position: relative; }
.chart { position: absolute; inset: 0; }
.empty { color: var(--muted); font-size: 11px; }
.big { font-size: 26px; font-weight: 700; color: var(--accent); text-shadow: 0 0 14px rgba(117, 214, 255, 0.45); line-height: 1; }
.chg { font-size: 10px; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }
.met { color: var(--good); font-weight: 700; } .missed { color: var(--bad); font-weight: 700; }
.bullet { margin: 6px 0 12px; }
.bullet .lab { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
.bullet .track { position: relative; height: 5px; border-radius: 3px; background: rgba(117, 214, 255, 0.1); }
.bullet .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.bullet .mark { position: absolute; top: -4px; bottom: -4px; border-left: 1.5px dashed rgba(230, 240, 246, 0.8); }
table { width: 100%; border-collapse: collapse; font-size: 10.5px; table-layout: fixed; }
th { text-align: left; color: var(--muted); font-size: 9px; text-transform: uppercase; padding: 3px;
  border-bottom: 1px solid var(--edge); }
td { padding: 4px 3px; border-bottom: 1px solid rgba(117, 214, 255, 0.1); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
td.id { color: var(--hot); text-shadow: 0 0 8px rgba(63, 208, 255, 0.4); }
.chip { display: inline-block; padding: 0 5px; border-radius: 4px; font-size: 9.5px; font-weight: 700; }
.chip.new { color: var(--accent); background: rgba(117, 214, 255, 0.12); }
.chip.revised { color: var(--warn); background: rgba(255, 197, 71, 0.14); }
.chip.superseded { color: #8FA9BC; background: rgba(159, 183, 201, 0.12); }
.item { display: flex; gap: 7px; font-size: 11px; padding: 5px 0; border-bottom: 1px solid rgba(117, 214, 255, 0.1); }
.dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 4px; flex: none; }
.tl { position: relative; padding-left: 16px; font-size: 11px; }
.tl::before { content: ''; position: absolute; left: 4px; top: 4px; bottom: 4px; width: 1px; background: rgba(117, 214, 255, 0.35); }
.tl .step { position: relative; padding: 2px 0 6px; }
.tl .step::before { content: ''; position: absolute; left: -15px; top: 6px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.tl .step.warn::before { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
.tl .when { color: var(--muted); font-size: 9.5px; }
.card { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 11px; }
.card .k { color: var(--muted); } .card .v { text-align: right; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; height: 100%; }
.tile { border: 1px solid rgba(117, 214, 255, 0.16); border-radius: 7px; padding: 4px 6px;
  display: flex; flex-direction: column; min-height: 0; background: rgba(14, 44, 61, 0.45); }
.tile .n { font-size: 9.5px; color: var(--muted); } .tile .v { font-size: 15px; font-weight: 700; }
.tile .spark { flex: 1; min-height: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ask, and get a plot</h1>
  <div class="sub">The plots are made in advance; the question's words pick one, and the real figures fill it.</div>
  <div class="ask">
    <input id="q" placeholder="Ask about the invoices" autocomplete="off">
    <button id="go">Ask</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="meta" id="meta"></div>
  <section class="panel" id="panel"><div class="empty">Ask a question, or click one above.</div></section>
</div>
<script>
const AX = '#9FB7C9', GRID = 'rgba(117, 214, 255, 0.10)', TXT = '#E6F0F6';
const CYAN = '#75D6FF', MINT = '#2EF2B0', CORAL = '#FF4F7B', AMBER = '#FFC547', VIOLET = '#7C6CFF';
const CATS = ['#75D6FF', '#3A8FD9', '#7C6CFF', '#4FB3C9', '#5B7C93', '#A9C6D8', '#2E4F66'];
const STATUS = {new: CYAN, revised: AMBER, superseded: '#5B7C93'};
const tip = {backgroundColor: '#0E2C3D', borderColor: '#14384C', textStyle: {color: TXT, fontSize: 11}};
const axisCat = d => ({type: 'category', data: d, axisTick: {show: false},
  axisLabel: {color: AX, fontSize: 9}, axisLine: {lineStyle: {color: GRID}}});
const axisVal = x => Object.assign({type: 'value', axisLabel: {color: AX, fontSize: 9},
  splitLine: {lineStyle: {color: GRID}}}, x || {});
const glow = c => ({color: c, shadowColor: c, shadowBlur: 6});
const fade = (r, g, b) => ({color: new echarts.graphic.LinearGradient(0, 0, 0, 1,
  [{offset: 0, color: `rgba(${r},${g},${b},.30)`}, {offset: 1, color: `rgba(${r},${g},${b},0)`}])});
const refY = (v, t) => ({symbol: 'none', silent: true, label: {color: AX, fontSize: 9, formatter: t},
  lineStyle: {color: 'rgba(230,240,246,.8)', type: 'dashed', width: 1}, data: [{yAxis: v}]});
const grid = rows => {
  const out = [];
  rows.forEach((row, r) => row.forEach((v, c) => out.push([c, r, v])));
  return out;
};
const arrow = (v, unit) => v === null ? 'no earlier figure'
  : `<span class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '▲' : '▼'}</span> ${Math.abs(v)}${unit}`;

/* The 24 ready-made plots: for each category, three builders that take
   the server's figures and return a title and either HTML or a chart. */
const PLOTS = {
  volume: [
    f => ({kind: 'Columns', title: 'Objects per week',
      html: `<div style="display:flex;gap:10px;align-items:flex-end;height:30px"><div class="big">${f.total}</div>` +
            `<div class="chg">${arrow(f.vs_week, '% last week')}<br>${arrow(f.vs_month, '% last month')}</div></div>` +
            '<div style="position:absolute;left:0;right:0;top:34px;bottom:0"><div class="chart"></div></div>',
      option: {grid: {left: 24, right: 4, top: 8, bottom: 18}, xAxis: axisCat(f.weeks), yAxis: axisVal(),
        series: [{type: 'bar', barWidth: '50%', data: f.counts.map((v, i) =>
          ({value: v, itemStyle: glow(i === f.counts.length - 1 ? CYAN : 'rgba(117,214,255,.45)')}))}]}}),
    f => ({kind: 'Heatmap', title: 'Objects by weekday and week',
      option: {grid: {left: 30, right: 4, top: 4, bottom: 18}, xAxis: axisCat(f.weeks),
        yAxis: Object.assign(axisCat(['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']), {inverse: true}),
        visualMap: {show: false, min: 0, max: Math.max(1, ...f.weekday.flat()),
                    inRange: {color: ['rgba(117,214,255,0.05)', CYAN]}},
        series: [{type: 'heatmap', data: grid(f.weekday), label: {show: true, color: '#061C28', fontSize: 9,
          formatter: p => p.value[2] || ''}, itemStyle: {borderColor: '#061C28', borderWidth: 2, borderRadius: 3}}]}}),
    f => ({kind: 'Cumulative area', title: 'Objects so far in the period',
      option: {grid: {left: 28, right: 26, top: 10, bottom: 18},
        xAxis: Object.assign(axisCat(f.weeks), {boundaryGap: false}), yAxis: axisVal(),
        series: [{type: 'line', smooth: true, symbol: 'none',
          data: f.counts.reduce((a, v) => a.concat([(a[a.length - 1] || 0) + v]), []),
          lineStyle: {width: 2, color: CYAN, shadowColor: CYAN, shadowBlur: 8}, areaStyle: fade(117, 214, 255),
          endLabel: {show: true, color: CYAN, fontSize: 11, fontWeight: 700}}]}}),
  ],
  target: [
    f => ({kind: 'Bullets', title: 'Are we on target this week?',
      html: f.bullets.map(([name, value, target, met]) => {
        const fill = name.startsWith('Automation') ? Math.min(100, value * 20) : value;
        const mark = name.startsWith('Automation') ? 20 : 100;
        return `<div class="bullet"><div class="lab"><span>${name}</span><span class="${met ? 'met' : 'missed'}">${value}%</span></div>` +
          `<div class="track"><div class="fill" style="width:${Math.max(fill, 1)}%;background:${met ? MINT : CORAL}"></div>` +
          `<div class="mark" style="left:${mark}%"></div></div></div>`;
      }).join('')}),
    f => ({kind: 'Gauge', title: 'Processed this week',
      option: {series: [{type: 'gauge', startAngle: 210, endAngle: -30, min: 0, max: 100, radius: '90%',
        center: ['50%', '58%'], progress: {show: true, width: 9,
          itemStyle: glow(f.completed[f.completed.length - 1] >= 100 ? MINT : CORAL)},
        axisLine: {lineStyle: {width: 9, color: [[1, 'rgba(117,214,255,0.1)']]}},
        axisTick: {show: false}, splitLine: {show: false}, axisLabel: {show: false}, pointer: {show: false},
        title: {offsetCenter: [0, '40%'], color: AX, fontSize: 10},
        detail: {offsetCenter: [0, '0%'], fontSize: 24, fontWeight: 700, formatter: '{value}%',
                 color: f.completed[f.completed.length - 1] >= 100 ? MINT : CORAL},
        data: [{value: f.completed[f.completed.length - 1], name: 'target 100%'}]}]}}),
    f => ({kind: 'Line with target', title: 'Supplier errors decided within 7 days, by week',
      option: {grid: {left: 30, right: 10, top: 12, bottom: 18},
        xAxis: Object.assign(axisCat(f.weeks), {boundaryGap: false}),
        yAxis: axisVal({name: 'days', nameTextStyle: {color: AX, fontSize: 9}}),
        series: [{type: 'scatter', symbolSize: 8,
          data: f.decide.map(([w, d]) => ({value: [w, d], itemStyle: glow(d <= 7 ? MINT : CORAL)})),
          markLine: refY(7, 'target 7 days')}]}}),
  ],
  errors: [
    f => ({kind: 'Horizontal bars', title: 'Errors by type in the period',
      option: {grid: {left: 12, right: 26, top: 6, bottom: 6, containLabel: true},
        xAxis: {type: 'value', show: false},
        yAxis: {type: 'category', inverse: true, axisTick: {show: false}, axisLine: {show: false},
          axisLabel: {color: TXT, fontSize: 10}, data: f.error_types.map(e => e[0])},
        series: [{type: 'bar', barWidth: 8, label: {show: true, position: 'right', color: TXT, fontSize: 10},
          data: f.error_types.map(([n, v]) => ({value: v,
            itemStyle: glow(v === 0 ? MINT : n.startsWith('Supplier') ? CORAL : AMBER)}))}]}}),
    f => ({kind: 'Scatter', title: 'Days to confirm each supplier error',
      option: {grid: {left: 30, right: 10, top: 12, bottom: 18}, xAxis: axisCat(f.weeks), yAxis: axisVal(),
        series: [{type: 'scatter', symbolSize: 9,
          data: f.decide.map(([w, d]) => ({value: [w, d], itemStyle: glow(d <= 7 ? MINT : CORAL)})),
          markLine: refY(7, 'target 7 days')}]}}),
    f => ({kind: 'Matrix', title: 'Errors by type and week',
      option: {grid: {left: 66, right: 4, top: 4, bottom: 18}, xAxis: axisCat(f.weeks),
        yAxis: Object.assign(axisCat(['Supplier', 'Automation', 'Revised', 'Superseded']), {inverse: true}),
        visualMap: {show: false, min: 0, max: Math.max(1, ...f.error_matrix.flat()),
                    inRange: {color: ['rgba(255,79,123,0.05)', CORAL]}},
        series: [{type: 'heatmap', data: grid(f.error_matrix), label: {show: true, color: TXT, fontSize: 9,
          formatter: p => p.value[2] || ''}, itemStyle: {borderColor: '#061C28', borderWidth: 2, borderRadius: 3}}]}}),
  ],
  ranking: [
    f => ({kind: 'Horizontal bars', title: 'Top actors by objects',
      option: {grid: {left: 12, right: 26, top: 4, bottom: 4, containLabel: true},
        xAxis: {type: 'value', show: false},
        yAxis: {type: 'category', inverse: true, axisTick: {show: false}, axisLine: {show: false},
          axisLabel: {color: TXT, fontSize: 10}, data: f.issuers.slice(0, 6).map(i => i[0])},
        series: [{type: 'bar', barWidth: 7, data: f.issuers.slice(0, 6).map(i => i[1]),
          itemStyle: Object.assign(glow(CYAN), {borderRadius: 3}),
          label: {show: true, position: 'right', color: TXT, fontSize: 10}}]}}),
    f => ({kind: 'Treemap', title: 'Share of objects by actor',
      option: {series: [{type: 'treemap', roam: false, nodeClick: false, breadcrumb: {show: false},
        left: 0, right: 0, top: 0, bottom: 0, label: {fontSize: 10, color: '#061C28', fontWeight: 700},
        itemStyle: {borderColor: '#061C28', borderWidth: 2, gapWidth: 2},
        data: f.issuers.map(([n, v], i) => ({name: n, value: v, itemStyle: {color: CATS[i % 6]}}))}]}}),
    f => ({kind: 'Catplot (split violin)', title: 'Lines per object, by actor',
      option: violin(f.catplot)}),
  ],
  trend: [
    f => ({kind: 'Two lines', title: 'This month against the last',
      option: {grid: {left: 26, right: 10, top: 24, bottom: 18},
        legend: {top: 0, right: 0, textStyle: {color: AX, fontSize: 9}, itemWidth: 12, itemHeight: 2},
        xAxis: Object.assign(axisCat(f.this_month.map((_, i) => 'Week ' + (i + 1))), {boundaryGap: false}),
        yAxis: axisVal(),
        series: [{name: 'This month', type: 'line', smooth: true, data: f.this_month, symbolSize: 5,
                  lineStyle: {width: 2, color: CYAN, shadowColor: CYAN, shadowBlur: 8},
                  itemStyle: {color: CYAN}, areaStyle: fade(117, 214, 255)},
                 {name: 'Last month', type: 'line', smooth: true, data: f.last_month, symbol: 'none',
                  lineStyle: {width: 1.2, color: 'rgba(230,240,246,.75)', type: 'dashed'},
                  itemStyle: {color: 'rgba(230,240,246,.75)'}}]}}),
    f => ({kind: 'Waterfall', title: 'Change from week to week',
      option: (() => {
        const base = [], rise = [], fall = [];
        let level = f.counts[0];
        f.counts.slice(1).forEach((v, i) => {
          const d = v - f.counts[i];
          base.push(d >= 0 ? level : level + d); rise.push(d >= 0 ? d : '-'); fall.push(d < 0 ? -d : '-');
          level += d;
        });
        return {grid: {left: 26, right: 6, top: 10, bottom: 18}, xAxis: axisCat(f.weeks.slice(1)), yAxis: axisVal(),
          series: [{type: 'bar', stack: 'w', data: base, itemStyle: {color: 'transparent'}, silent: true},
                   {type: 'bar', stack: 'w', data: rise, barWidth: '50%', itemStyle: glow(MINT)},
                   {type: 'bar', stack: 'w', data: fall, itemStyle: glow(CORAL)}]};
      })()}),
    f => ({kind: 'Stacked area', title: 'Object types over time',
      option: {grid: {left: 30, right: 6, top: 22, bottom: 18},
        legend: {top: 0, right: 0, textStyle: {color: AX, fontSize: 9}, itemWidth: 8, itemHeight: 8},
        xAxis: Object.assign(axisCat(f.weeks), {boundaryGap: false}), yAxis: axisVal(),
        series: Object.entries(f.kind_weeks).map(([n, d], i) => ({name: n, type: 'line', stack: 't',
          smooth: true, symbol: 'none', data: d, lineStyle: {width: 1, color: CATS[i]},
          itemStyle: {color: CATS[i]}, areaStyle: {color: CATS[i], opacity: 0.35}}))}}),
  ],
  mix: [
    f => ({kind: 'Donut', title: 'Objects by type',
      option: {legend: {orient: 'vertical', right: 0, top: 'middle', icon: 'circle', itemWidth: 7, itemHeight: 7,
        textStyle: {color: TXT, fontSize: 10}},
        series: [{type: 'pie', radius: ['40%', '66%'], center: ['34%', '50%'], label: {show: false},
          itemStyle: {borderColor: 'rgba(6,28,40,.9)', borderWidth: 0.5}, color: CATS,
          data: f.kinds.map(([n, v]) => ({name: n, value: v}))}]}}),
    f => ({kind: '100% stacked columns', title: 'Status share per week',
      option: {grid: {left: 34, right: 6, top: 20, bottom: 18},
        legend: {top: 0, right: 0, textStyle: {color: AX, fontSize: 9}, itemWidth: 8, itemHeight: 8},
        xAxis: axisCat(f.weeks), yAxis: axisVal({max: 100, axisLabel: {color: AX, fontSize: 9, formatter: '{value}%'}}),
        series: Object.entries(f.status_share).map(([n, d]) => ({name: n, type: 'bar', stack: 's',
          barWidth: '55%', data: d, itemStyle: {color: STATUS[n]}}))}}),
    f => ({kind: 'Nested treemap', title: 'Type, then status',
      option: {series: [{type: 'treemap', roam: false, nodeClick: false, breadcrumb: {show: false},
        left: 0, right: 0, top: 0, bottom: 0, label: {color: '#061C28', fontSize: 9, fontWeight: 700},
        levels: [{itemStyle: {borderWidth: 0, gapWidth: 4, color: 'transparent', borderColor: 'transparent'},
                  upperLabel: {show: false}},
                 {itemStyle: {borderWidth: 2, gapWidth: 2},
                  upperLabel: {show: true, height: 16, color: '#061C28', fontSize: 10, fontWeight: 700}},
                 {itemStyle: {borderWidth: 0}}],
        data: Object.entries(f.kind_status).map(([k, st], i) => ({name: k,
          itemStyle: {color: CATS[i], borderColor: CATS[i]},
          children: Object.entries(st).map(([s, v]) => ({name: s, value: v,
            itemStyle: {color: s === 'new' ? CATS[i] : STATUS[s]}}))}))}]}}),
  ],
  lookup: [
    (f, x) => ({kind: 'Table', title: 'Objects that match',
      html: '<table><thead><tr><th style="width:44%">Object</th><th style="width:32%">Actor</th><th>Status</th></tr></thead><tbody>' +
        f.table.map(([id, a, s]) => `<tr><td class="id">${id}</td><td>${a}</td><td><span class="chip ${s}">${s}</span></td></tr>`).join('') +
        '</tbody></table>'}),
    (f, x) => ({kind: 'Timeline', title: 'History of ' + x.number,
      html: '<div class="tl">' + x.steps.map(([w, d, t]) =>
        `<div class="step ${t}">${w}<div class="when">${d}</div></div>`).join('') + '</div>'}),
    (f, x) => ({kind: 'Detail card', title: x.number,
      html: '<div class="card">' + x.card.map(([k, v]) => `<span class="k">${k}</span><span class="v">${
        k === 'Status' ? `<span class="chip ${v}">${v}</span>` : v}</span>`).join('') + '</div>'}),
  ],
  overview: [
    (f, x) => ({kind: 'Attention list', title: 'What needs attention',
      html: x.attention.map(([tone, text]) => {
        const c = {met: MINT, missed: CORAL, warn: AMBER, volume: CYAN}[tone];
        return `<div class="item"><span class="dot" style="background:${c};box-shadow:0 0 6px ${c}"></span><span>${text}</span></div>`;
      }).join('')}),
    f => ({kind: 'Sparkline tiles', title: 'The period at a glance',
      html: '<div class="tiles">' + [['Objects', f.total, CYAN, f.counts], ['Processed', f.completed[f.completed.length - 1] + '%', MINT, f.completed],
        ['Supplier errors', f.supplier[f.supplier.length - 1], f.supplier[f.supplier.length - 1] ? CORAL : MINT, f.supplier],
        ['Revised', f.revised[f.revised.length - 1], f.revised[f.revised.length - 1] ? AMBER : MINT, f.revised]]
        .map(([n, v, c, s], i) => `<div class="tile"><span class="n">${n}</span><span class="v" style="color:${c}">${v}</span>` +
          `<div class="spark" data-colour="${c}" data-values="${s.join(',')}"></div></div>`).join('') + '</div>'}),
    f => ({kind: 'Target matrix', title: 'Targets, week by week',
      option: {grid: {left: 66, right: 4, top: 4, bottom: 18}, xAxis: axisCat(f.weeks),
        yAxis: Object.assign(axisCat(f.matrix_kpis), {inverse: true}),
        visualMap: {show: false, type: 'piecewise', pieces: [{value: 0, color: CORAL}, {value: 1, color: MINT}]},
        series: [{type: 'heatmap', data: grid(f.matrix),
          itemStyle: {borderColor: '#061C28', borderWidth: 3, borderRadius: 4, opacity: 0.85}}]}}),
  ],
};

/* The catplot: a split violin per actor, the latest weeks on top and the
   earlier weeks below, with the mean and ±1 and ±2 standard deviations. */
function violin(c) {
  const MAX = Math.max(6, ...c.now.flat(), ...c.before.flat()) + 1, STEPS = 48;
  const xs = Array.from({length: STEPS + 1}, (_, i) => i * MAX / STEPS);
  const dens = l => { const ys = xs.map(x => l.reduce((s, d) => s + Math.exp(-0.5 * ((x - d) / 0.6) ** 2), 0));
    const t = Math.max(...ys, 1e-9); return ys.map(y => y / t); };
  const stats = l => { if (!l.length) return [0, 0]; const m = l.reduce((s, d) => s + d, 0) / l.length;
    return [m, l.length > 1 ? Math.sqrt(l.reduce((s, d) => s + (d - m) ** 2, 0) / (l.length - 1)) : 0]; };
  const half = (name, colour, lists, side) => ({name: name, type: 'custom', itemStyle: {color: colour},
    data: lists.map((_, r) => [r]),
    renderItem: (p, api) => {
      const l = lists[p.dataIndex]; if (!l.length) return null;
      const row = p.dataIndex, d = dens(l), [m, sd] = stats(l);
      const centre = api.coord([0, row])[1], room = api.size([0, 1])[1] * 0.47;
      const lo = Math.max(0, Math.min(...l) - 0.5), hi = Math.min(MAX, Math.max(...l) + 0.5);
      const pts = xs.map((x, i) => [x, i]).filter(([x]) => x >= lo && x <= hi)
        .map(([x, i]) => [api.coord([x, row])[0], centre - side * d[i] * room]);
      pts.push([api.coord([hi, row])[0], centre], [api.coord([lo, row])[0], centre]);
      const y = centre - side * room * 0.28, at = x => api.coord([Math.max(0, Math.min(MAX, x)), row])[0];
      return {type: 'group', children: [
        {type: 'polygon', shape: {points: pts, smooth: 0.3},
         style: {fill: colour, opacity: 0.45, stroke: colour, lineWidth: 1, shadowColor: colour, shadowBlur: 6}},
        {type: 'line', shape: {x1: at(m - 2 * sd), y1: y, x2: at(m + 2 * sd), y2: y},
         style: {stroke: TXT, lineWidth: 0.5, opacity: 0.35, lineDash: [2, 2]}},
        {type: 'line', shape: {x1: at(m - sd), y1: y, x2: at(m + sd), y2: y},
         style: {stroke: TXT, lineWidth: 0.7, opacity: 0.85}},
        {type: 'circle', shape: {cx: at(m), cy: y, r: 2.4}, style: {fill: TXT}}]};
    }});
  const shift = c.actors.map((_, i) => stats(c.now[i])[0] - stats(c.before[i])[0]);
  const moved = d => Math.abs(d) < 0.05 ? '{f|avg = 0.0 lines}'
    : d > 0 ? `{a|avg ▲ ${d.toFixed(1)} lines}` : `{a|avg ▼ ${(-d).toFixed(1)} lines}`;
  return {grid: {left: 100, right: 10, top: 30, bottom: 18},
    title: {text: 'avg: lines per object, latest four weeks vs the four before', left: 0, top: 0,
            textStyle: {color: AX, fontSize: 9, fontWeight: 400}},
    legend: {top: 12, right: 0, textStyle: {color: AX, fontSize: 9}, itemWidth: 10, itemHeight: 6,
             data: ['Latest 4 weeks', 'Earlier 4 weeks']},
    xAxis: axisVal({min: 0, max: MAX, interval: 1}),
    yAxis: Object.assign(axisCat(c.actors), {inverse: true, axisLabel: {
      formatter: (n, i) => `{n|${n}}\n${moved(shift[i])}`,
      rich: {n: {color: TXT, fontSize: 10, lineHeight: 13}, a: {color: CYAN, fontSize: 9}, f: {color: AX, fontSize: 9}}}}),
    series: [half('Latest 4 weeks', CYAN, c.now, 1), half('Earlier 4 weeks', VIOLET, c.before, -1)]};
}

const CAT_NAMES = {volume: '1 · Volume', target: '2 · Target', errors: '3 · Errors', ranking: '4 · Ranking',
  trend: '5 · Trend', mix: '6 · Mix', lookup: '7 · Lookup', overview: '8 · Overview'};
let drawn = [];

function draw(answer) {
  drawn.forEach(c => c.dispose());
  drawn = [];
  const spec = PLOTS[answer.category][answer.plot](answer.figures, answer.extra || {});
  const panel = document.getElementById('panel');
  panel.innerHTML = `<div class="top"><span class="cat">${CAT_NAMES[answer.category]}</span>` +
    `<span class="kind">${spec.kind}</span></div><h2>${spec.title}</h2>` +
    `<div class="body">${spec.html || '<div class="chart"></div>'}</div>`;
  document.getElementById('meta').innerHTML =
    `Category <b>${answer.category}</b> (${answer.by_model ? 'model' : 'keywords'}) · key "${answer.key}" · ` +
    `plot <b>${answer.plot + 1} of 3</b>, ${answer.plot_name}` +
    (answer.again ? ' · <span class="again">same question, same plot</span>' : '');
  setTimeout(() => {
    if (spec.option) {
      const c = echarts.init(panel.querySelector('.chart'), null, {renderer: 'canvas'});
      c.setOption(Object.assign({backgroundColor: 'transparent', tooltip: tip, animationDuration: 400}, spec.option));
      drawn.push(c);
    }
    panel.querySelectorAll('.spark').forEach(node => {
      const c = echarts.init(node, null, {renderer: 'canvas'}), colour = node.dataset.colour;
      c.setOption({backgroundColor: 'transparent', grid: {left: 0, right: 0, top: 2, bottom: 2},
        xAxis: {type: 'category', show: false, boundaryGap: false}, yAxis: {type: 'value', show: false, scale: true},
        series: [{type: 'line', smooth: true, symbol: 'none', data: node.dataset.values.split(',').map(Number),
          lineStyle: {width: 1.5, color: colour, shadowColor: colour, shadowBlur: 6}}]});
      drawn.push(c);
    });
  }, 0);
}

async function ask(question) {
  if (!question.trim()) return;
  document.getElementById('meta').textContent = 'Thinking…';
  const reply = await fetch('/api/plot-answer', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question: question})});
  if (!reply.ok) { document.getElementById('meta').textContent = await reply.text(); return; }
  draw(await reply.json());
}

['How many invoices came in this week?', 'How many invoices came in last week?',
 'Are we on track to hit the target?', 'Any supplier errors this month?',
 'Which supplier sent the most invoices?', 'Did volume go up compared to last month?',
 'What share of invoices are freight?', 'Status of KNG-2026-3232-R1', 'Anything I should worry about?']
  .forEach(q => {
    const b = document.createElement('button');
    b.textContent = q;
    b.onclick = () => { document.getElementById('q').value = q; ask(q); };
    document.getElementById('chips').appendChild(b);
  });
document.getElementById('go').onclick = () => ask(document.getElementById('q').value);
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(e.target.value); });
